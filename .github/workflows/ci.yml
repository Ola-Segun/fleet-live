# Every push and pull request: the gates in docs/QUALITY.md.
#
#   check    typecheck (packages, app, browser scripts), lint, 224 unit and
#            property tests, a production build, and the bundle budget
#   browser  every browser check against the built app, in Chromium with
#            software WebGL. Functional and accessibility checks gate; frame
#            times are measured but not gated here (no GPU on the runner).

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version from package.json "packageManager"
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm --filter @fleet/web build
      - run: pnpm bundle:size

  cloudflare:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @fleet/web cf:build
      - run: pnpm --filter @fleet/web exec wrangler deploy --dry-run

  browser:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm --filter @fleet/web build
      - name: Start the app
        run: |
          pnpm --filter @fleet/web start -p 3100 > next.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:3100/ > /dev/null && exit 0; sleep 1; done
          cat next.log; exit 1
      - run: pnpm smoke:web
      - run: pnpm smoke:ui
      - run: pnpm smoke:alerts
      - run: pnpm smoke:replay
      - run: pnpm a11y
      - run: pnpm a11y:contrast
      - name: Keep the screenshots and accessibility trees
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-checks
          path: |
            scripts/*.png
            docs/a11y/*.txt
            next.log
